name: Release APK
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - name: Test, lint, and build APK
        run: ./gradlew test lint assembleDebug
      - name: Name APK with version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "guri-launcher-${TAG_NAME}.apk"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "guri-launcher-${{ github.ref_name }}.apk" --generate-notes --verify-tag
