name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_name: ${{ steps.metadata.outputs.apk_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test release scripts
        run: make release-test

      - name: Verify tag commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            echo "error: release tags must point to a commit on $DEFAULT_BRANCH." >&2
            exit 1
          fi

      - name: Derive release metadata
        id: metadata
        run: ./scripts/release/release-metadata.sh "$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEYSTORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf 'error: missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Restore release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode >"$RUNNER_TEMP/guri-launcher-release.keystore"

      - name: Test, lint, and build signed APK
        env:
          GURI_RELEASE_SIGNING_REQUIRED: "true"
          ANDROID_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/guri-launcher-release.keystore
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew test lint assembleRelease \
            -PguriVersionName="${{ steps.metadata.outputs.version_name }}" \
            -PguriVersionCode="${{ steps.metadata.outputs.version_code }}"

      - name: Verify and name APK
        env:
          APK_NAME: ${{ steps.metadata.outputs.apk_name }}
          EXPECTED_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$source_apk"
          if ! command -v apkanalyzer >/dev/null 2>&1; then
            echo "error: apkanalyzer was not found in the Android SDK." >&2
            exit 1
          fi
          actual_version_name="$(apkanalyzer manifest version-name "$source_apk")"
          actual_version_code="$(apkanalyzer manifest version-code "$source_apk")"
          if [[ "$actual_version_name" != "$EXPECTED_VERSION_NAME" \
            || "$actual_version_code" != "$EXPECTED_VERSION_CODE" ]]; then
            printf 'error: APK version is %s (%s), expected %s (%s).\n' \
              "$actual_version_name" "$actual_version_code" \
              "$EXPECTED_VERSION_NAME" "$EXPECTED_VERSION_CODE" >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner \
            -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "error: apksigner was not found in the Android SDK." >&2
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$source_apk"
          mkdir -p dist
          cp "$source_apk" "dist/$APK_NAME"

      - name: Remove release keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/guri-launcher-release.keystore"

      - name: Store APK for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/${{ steps.metadata.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/$APK_NAME" \
            --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
